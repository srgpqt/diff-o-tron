	<!-- The robot, drawn on a 1024 canvas, scaled to fill the shape, its chin near the bottom. -->
	<g clip-path="url(#shape)">
		<g transform="translate(512 874) scale(0.9) translate(-512 -900)">
			<g filter="url(#shadow)">
				<!-- Antenna, bent over to fit. -->
				<path d="M 512 250 L 512 204 Q 512 160 556 148" fill="none" stroke="url(#metal)" stroke-width="26" stroke-linecap="round"/>
				<circle cx="592" cy="138" r="42" fill="url(#antenna)"/>

				<!-- Ears. -->
				<rect x="108" y="470" width="80" height="196" rx="32" fill="url(#metal)"/>
				<rect x="836" y="470" width="80" height="196" rx="32" fill="url(#metal)"/>

				<!-- The head: side A on the left, side B on the right. -->
				<g clip-path="url(#head)">
					<rect x="160" y="236" width="352" height="664" fill="url(#sideA)"/>
					<rect x="512" y="236" width="352" height="664" fill="url(#sideB)"/>
					<!-- A sheen across the top. -->
					<ellipse cx="512" cy="262" rx="330" ry="76" fill="#FFFFFF" opacity="0.2"/>
				</g>
			</g>
			<circle cx="577" cy="123" r="12" fill="#FFFFFF" opacity="0.8"/>

			<!-- The seam between the sides. -->
			<line x1="512" y1="244" x2="512" y2="892" stroke="#FFFFFF" stroke-width="10" opacity="0.55"/>

			<!-- Eyes. -->
