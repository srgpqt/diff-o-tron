<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
	<!--
		Diff-o-tron's app icon: a robot head whose face is split down the middle,
		like the two sides of a comparison. The head is the icon's rounded square,
		on a 1024 canvas, leaving room around it for the ears and antenna.
		`make icon` turns it into macOS/AppIcon.icns.
	-->
	<defs>
		<linearGradient id="sideA" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#FF8A80"/>
			<stop offset="1" stop-color="#EE5A55"/>
		</linearGradient>
		<linearGradient id="sideB" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#7EE0A6"/>
			<stop offset="1" stop-color="#3FBE80"/>
		</linearGradient>
		<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#C3BDDC"/>
			<stop offset="1" stop-color="#9890B8"/>
		</linearGradient>
		<radialGradient id="antenna" cx="0.35" cy="0.35" r="0.75">
			<stop offset="0" stop-color="#B9ADFF"/>
			<stop offset="1" stop-color="#7A66E0"/>
		</radialGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
		</filter>
		<clipPath id="head">
			<rect x="160" y="236" width="704" height="664" rx="170"/>
		</clipPath>
	</defs>

	<g filter="url(#shadow)">
		<!-- Antenna. -->
		<rect x="499" y="130" width="26" height="124" rx="13" fill="url(#metal)"/>
		<circle cx="512" cy="112" r="50" fill="url(#antenna)"/>

		<!-- Ears. -->
		<rect x="108" y="470" width="80" height="196" rx="32" fill="url(#metal)"/>
		<rect x="836" y="470" width="80" height="196" rx="32" fill="url(#metal)"/>

		<!-- The head: side A on the left, side B on the right. -->
		<g clip-path="url(#head)">
			<rect x="160" y="236" width="352" height="664" fill="url(#sideA)"/>
			<rect x="512" y="236" width="352" height="664" fill="url(#sideB)"/>
			<!-- A sheen across the top. -->
			<ellipse cx="512" cy="262" rx="330" ry="76" fill="#FFFFFF" opacity="0.2"/>
		</g>
	</g>
	<circle cx="494" cy="94" r="14" fill="#FFFFFF" opacity="0.8"/>

	<!-- The seam between the sides. -->
	<line x1="512" y1="244" x2="512" y2="892" stroke="#FFFFFF" stroke-width="10" opacity="0.55"/>

	<!-- Eyes. -->
	<circle cx="378" cy="530" r="96" fill="#FFFFFF"/>
	<circle cx="646" cy="530" r="96" fill="#FFFFFF"/>
	<circle cx="394" cy="544" r="50" fill="#26233F"/>
	<circle cx="662" cy="544" r="50" fill="#26233F"/>
	<circle cx="413" cy="522" r="17" fill="#FFFFFF"/>
	<circle cx="681" cy="522" r="17" fill="#FFFFFF"/>

	<!-- Cheeks. -->
	<ellipse cx="282" cy="698" rx="48" ry="29" fill="#FFFFFF" opacity="0.35"/>
	<ellipse cx="742" cy="698" rx="48" ry="29" fill="#FFFFFF" opacity="0.35"/>

	<!-- Smile. -->
	<path d="M 428 712 Q 512 796 596 712" fill="none" stroke="#26233F" stroke-width="26" stroke-linecap="round"/>
</svg>
