<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
	<!--
		Diff-o-tron's app icon: a robot head whose face is split down the middle,
		like the two sides of a comparison, on macOS's icon shape. Since macOS 26
		puts icons of other shapes on a grey one, the robot fills this one, its
		ears and bent antenna within it: the shape is 824 across on the 1024
		canvas, as on Apple's icon grid, drawn as a superellipse close to the
		system's mask. `make icon` turns it into macOS/AppIcon.icns.
	-->
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#4C4486"/>
			<stop offset="1" stop-color="#26223F"/>
		</linearGradient>
		<radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
			<stop offset="0" stop-color="#8E7FE8" stop-opacity="0.45"/>
			<stop offset="1" stop-color="#8E7FE8" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="sideA" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#FF8A80"/>
			<stop offset="1" stop-color="#EE5A55"/>
		</linearGradient>
		<linearGradient id="sideB" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#7EE0A6"/>
			<stop offset="1" stop-color="#3FBE80"/>
		</linearGradient>
		<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#C3BDDC"/>
			<stop offset="1" stop-color="#9890B8"/>
		</linearGradient>
		<radialGradient id="antenna" cx="0.35" cy="0.35" r="0.75">
			<stop offset="0" stop-color="#B9ADFF"/>
			<stop offset="1" stop-color="#7A66E0"/>
		</radialGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
		</filter>
