			<circle cx="646" cy="530" r="96" fill="#FFFFFF"/>
			<circle cx="394" cy="544" r="50" fill="#26233F"/>
			<circle cx="662" cy="544" r="50" fill="#26233F"/>
			<circle cx="413" cy="522" r="17" fill="#FFFFFF"/>
			<circle cx="681" cy="522" r="17" fill="#FFFFFF"/>

			<!-- Cheeks. -->
			<ellipse cx="282" cy="698" rx="48" ry="29" fill="#FFFFFF" opacity="0.35"/>
			<ellipse cx="742" cy="698" rx="48" ry="29" fill="#FFFFFF" opacity="0.35"/>

			<!-- Smile. -->
			<path d="M 428 712 Q 512 796 596 712" fill="none" stroke="#26233F" stroke-width="26" stroke-linecap="round"/>
